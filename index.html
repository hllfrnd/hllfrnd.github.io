<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Секретная страница приветствия">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f0f2f5">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <title>Hello Friend</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            min-height: 100vh;
            text-align: center;
            color: #1a1a1a;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            animation: fadeIn 1.2s ease-out both;
        }

        .symbol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            margin-bottom: 1rem;
            padding: 0;
            font-family: "Segoe UI Symbol", "Apple Color Emoji", "Noto Sans Symbols 2", sans-serif;
            font-size: 3rem;
            line-height: 1;
            color: #333;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            border: 0;
            border-radius: 50%;
            background: transparent;
            transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            animation: pulse 4s infinite ease-in-out;
            will-change: transform;
            touch-action: manipulation;
        }

        .symbol:hover {
            color: #000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .symbol:active {
            transform: scale(0.92);
            transition-duration: 0.08s;
        }

        .symbol:focus-visible {
            outline: 2px solid #333;
            outline-offset: 4px;
        }

        .symbol[aria-disabled="true"] {
            cursor: default;
            opacity: 0.5;
            animation: none;
            pointer-events: none;
            text-shadow: none;
        }

        h1 {
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            font-weight: 800;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #222;
            user-select: none;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 2rem;
            transform: translate(-50%, 1.5rem);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            max-width: calc(100vw - 2rem);
            padding: 0.85rem 1.25rem;
            font-size: 0.9rem;
            line-height: 1.3;
            color: #fff;
            background: #1f2328;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast__icon {
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .toast__text {
            min-width: 0;
            overflow-wrap: break-word;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            .symbol {
                animation: none;
            }
            .symbol {
                transition: none;
            }
            .toast {
                transition: opacity 0.15s ease;
            }
        }

        @media (prefers-contrast: more) {
            .symbol {
                color: #000;
                text-shadow: none;
            }
            h1 {
                color: #000;
            }
            .toast {
                border: 2px solid #fff;
            }
        }
    </style>
</head>
<body>

    <button type="button" class="symbol" id="magicSymbol" aria-label="Открыть случайную ссылку">☉</button>

    <h1>Hello Friend</h1>

    <div id="toast" class="toast" role="alert" aria-live="assertive">
        <span class="toast__icon" aria-hidden="true">🔗</span>
        <span class="toast__text" id="toastText"></span>
    </div>

    <noscript>
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: #666;">
            Для работы интерактивных элементов требуется JavaScript.
        </p>
    </noscript>

    <script>
        (() => {
            "use strict";

            const rawLinks = [
                "https://mrrobot.fandom.com/ru/wiki/Привет,_друг",
                "https://www.magnific.com/ru/free-photos-vectors/символ-глаз",
                "https://mrrobot.fandom.com/ru/wiki/Fsociety",
                "https://rickandmorty.fandom.com/wiki/Wubba_Lubba_dub-dub",
                "https://ru.wikipedia.org/wiki/Психическое_расстройство",
                "https://ru.wikipedia.org/wiki/Невидимость",
                "https://ru.wikipedia.org/wiki/Одиночество",
                "https://ru.wikipedia.org/wiki/Интернет",
                "https://ru.wikipedia.org/wiki/Белый_хакер",
                "https://ru.wikipedia.org/wiki/Чёрная_шляпа",
                "https://evilclowns.narod.ru/clay.htm?ysclid=mw27jzfe39838536538",
                "https://xakersalien.neocities.org/xaker"
            ];

            const ALLOWED_PROTOCOLS = new Set(["https:", "http:"]);
            const MAX_URL_LENGTH = 2048;
            const TOAST_DURATION = 3500;

            const isValidUrl = (value) => {
                if (typeof value !== "string") return false;
                const trimmed = value.trim();
                if (trimmed === "" || trimmed.length > MAX_URL_LENGTH) return false;

                try {
                    const parsed = new URL(trimmed);
                    return ALLOWED_PROTOCOLS.has(parsed.protocol);
                } catch {
                    return false;
                }
            };

            const seen = new Set();
            const links = rawLinks.filter((url) => {
                if (!isValidUrl(url)) return false;
                if (seen.has(url)) return false;
                seen.add(url);
                return true;
            });

            const symbol = document.getElementById("magicSymbol");
            const toast = document.getElementById("toast");
            const toastText = document.getElementById("toastText");

            if (!symbol) return;

            let toastTimer = 0;

            const hideToast = () => {
                window.clearTimeout(toastTimer);
                toastTimer = 0;
                if (toast) toast.classList.remove("is-visible");
            };

            const showToast = (message, duration = TOAST_DURATION) => {
                if (!toast || !toastText) return;
                toastText.textContent = message;
                toast.classList.add("is-visible");
                window.clearTimeout(toastTimer);
                toastTimer = window.setTimeout(hideToast, duration);
            };

            if (links.length === 0) {
                symbol.setAttribute("aria-disabled", "true");
                symbol.setAttribute("aria-label", "Ссылки недоступны");
                symbol.setAttribute("tabindex", "-1");
                symbol.setAttribute("disabled", "");
                return;
            }

            let lastIndex = -1;
            let isOpening = false;
            let resetTimer = 0;

            const pickRandomIndex = () => {
                if (links.length === 1) return 0;
                let index;
                let attempts = 0;
                do {
                    index = Math.floor(Math.random() * links.length);
                    attempts++;
                } while (index === lastIndex && attempts < 50);
                lastIndex = index;
                return index;
            };

            const openRandomLink = () => {
                if (isOpening) return;
                isOpening = true;

                const url = links[pickRandomIndex()];

                try {
                    const parsed = new URL(url);
                    if (!ALLOWED_PROTOCOLS.has(parsed.protocol)) {
                        isOpening = false;
                        showToast("Ссылка недоступна");
                        return;
                    }
                } catch {
                    isOpening = false;
                    showToast("Ссылка недоступна");
                    return;
                }

                let newTab = null;
                try {
                    newTab = window.open(url, "_blank", "noopener,noreferrer");
                } catch {
                    newTab = null;
                }

                if (newTab) {
                    try {
                        newTab.opener = null;
                    } catch {
                        /* cross-origin — игнорируем */
                    }
                    showToast("Открыта случайная ссылка");
                } else {
                    showToast("Переход по случайной ссылке…");
                    window.location.assign(url);
                }

                window.clearTimeout(resetTimer);
                resetTimer = window.setTimeout(() => {
                    isOpening = false;
                }, 400);
            };

            symbol.addEventListener("click", openRandomLink);

            symbol.addEventListener("keydown", (event) => {
                if (event.repeat) return;
                if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
                    event.preventDefault();
                    openRandomLink();
                }
            });

            toast.addEventListener("click", hideToast);

            window.addEventListener("pageshow", (event) => {
                isOpening = false;
                window.clearTimeout(resetTimer);
                resetTimer = 0;
                if (event.persisted) hideToast();
            });

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    window.clearTimeout(resetTimer);
                    resetTimer = 0;
                }
            });
        })();
    </script>

</body>
</html>
