<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Hello Friend — цифровой архив.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050506">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>☉ Hello Friend</title>
<style>
:root{
  --bg:#050506;
  --bg-2:#0a0a0c;
  --fg:#f2f2f4;
  --dim:#8a8a92;
  --mute:#3a3a40;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.22);
  --card:rgba(14,14,17,.55);
  --card-hover:rgba(22,22,27,.75);
  --accent:#ffffff;
  --glow:rgba(255,255,255,.12);
  --radius:18px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%),
    var(--bg);
}

.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 50% 40%, transparent 25%, rgba(0,0,0,.85) 100%)}

.container{position:relative;z-index:10;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2.5rem 1.5rem}

.header{display:flex;flex-direction:column;align-items:center;gap:.55rem;
  margin-bottom:3.25rem;animation:fadeInDown 1.1s ease-out both}
.logo{font-size:clamp(2.75rem,9vw,4.5rem);line-height:1;color:var(--accent);
  text-shadow:0 0 40px rgba(255,255,255,.22);animation:breathe 6s ease-in-out infinite}
.title{font-size:clamp(1rem,3vw,1.35rem);font-weight:800;letter-spacing:.5em;text-indent:.5em;
  text-transform:uppercase;color:var(--fg)}
.subtitle{font-size:.68rem;letter-spacing:.32em;color:var(--dim);text-transform:uppercase;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:.25rem}

.nav{display:flex;flex-direction:column;gap:.9rem;width:100%;max-width:460px;
  animation:fadeInUp 1.1s ease-out .2s both}

.card{display:flex;align-items:center;justify-content:space-between;
  padding:1.4rem 1.6rem;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  transition:transform .35s cubic-bezier(.25,1,.5,1),background-color .35s ease,
    border-color .35s ease,box-shadow .35s ease;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  position:relative;overflow:hidden;outline:none}
.card::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  transform:translateX(-100%);transition:transform .7s ease;pointer-events:none}
.card:hover{border-color:var(--line-strong);background:var(--card-hover);
  transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.55)}
.card:hover::before{transform:translateX(100%)}
.card:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.18)}

.card-content{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.card-title{font-size:1rem;font-weight:700;color:var(--fg);letter-spacing:.04em}
.card-desc{font-size:.75rem;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card-icon{font-size:1.15rem;color:var(--dim);flex-shrink:0;margin-left:1rem;
  transition:color .3s ease,transform .3s ease}
.card:hover .card-icon,.card:focus-visible .card-icon{color:var(--fg);transform:translateX(5px)}

.card--featured{background:linear-gradient(135deg,rgba(24,24,30,.85),rgba(10,10,13,.65));
  border-color:var(--line-strong);padding:1.7rem 1.8rem;
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 40px var(--glow),inset 0 1px 0 rgba(255,255,255,.06)}
.card--featured:hover{border-color:rgba(255,255,255,.5);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(255,255,255,.2),0 14px 34px rgba(0,0,0,.55)}
.card--featured .card-title{font-size:1.12rem;letter-spacing:.07em;display:flex;align-items:center;gap:.55rem}
.card--featured .card-desc{color:#a7a7ae}

.badge{font-size:.54rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:#050506;background:var(--accent);border-radius:999px;padding:.2rem .55rem;line-height:1.4;
  box-shadow:0 0 12px rgba(255,255,255,.3)}

.footer{margin-top:4rem;font-size:.68rem;color:var(--mute);letter-spacing:.14em;text-align:center;
  animation:fadeInUp 1.1s ease-out .4s both;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

@keyframes breathe{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
@media (max-width:600px){
  .header{margin-bottom:2.5rem}
  .title{letter-spacing:.3em;text-indent:.3em}
  .card{padding:1.15rem 1.3rem}
  .card--featured{padding:1.35rem 1.4rem}
}
</style>
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="container">
  <header class="header">
    <div class="logo" aria-hidden="true">☉</div>
    <h1 class="title">Hello Friend</h1>
  </header>

  <nav class="nav" aria-label="Основная навигация">
    <a href="https://hllfrnd.github.io/watcher/"
       class="card card--featured" rel="noopener"
       aria-label="Watcher (новая страница)">
      <div class="card-content">
        <div class="card-title">Watcher <span class="badge" aria-hidden="true">new</span></div>
        <div class="card-desc">наблюдение · сигналы · следы</div>
      </div>
      <div class="card-icon" aria-hidden="true">→</div>
    </a>

    <a href="./portal/" class="card" aria-label="Портал — случайные находки">
      <div class="card-content">
        <div class="card-title">Портал</div>
        <div class="card-desc">случайные находки и скрытые места</div>
      </div>
      <div class="card-icon" aria-hidden="true">→</div>
    </a>

    <a href="./console/" class="card" aria-label="Консоль — виртуальная система">
      <div class="card-content">
        <div class="card-title">Консоль</div>
        <div class="card-desc">виртуальная система и следы</div>
      </div>
      <div class="card-icon" aria-hidden="true">→</div>
    </a>
  </nav>
</main>
</body>
</html>
