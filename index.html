<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hello Friend — цифровой архив странностей и следов.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f0f2f5">
    <title>☉ Hello Friend</title>
    <script>
        // Предотвращаем мигание при загрузке (FOUC) и применяем тему
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        :root {
            --bg: #f0f2f5;
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
            --fg: #1a1a1a;
            --accent: #333;
            --accent-hover: #000;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(0, 0, 0, 0.08);
            --card-hover-border: rgba(0, 0, 0, 0.2);
            --card-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            --card-hover-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
            --mute: #71717a;
            --divider: rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg: #09090b;
            --bg-gradient: radial-gradient(120% 80% at 50% 0%, #18181b 0%, #09090b 100%);
            --fg: #ededed;
            --accent: #ededed;
            --accent-hover: #ffffff;
            --card-bg: rgba(24, 24, 27, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(255, 255, 255, 0.2);
            --card-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            --card-hover-shadow: 0 20px 40px -15px rgba(0,0,0,0.6);
            --mute: #a1a1aa;
            --divider: rgba(255,255,255,0.08);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        
        body {
            background: var(--bg-gradient);
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            color: var(--fg); overflow-x: hidden;
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
            transition: background-color 0.4s ease, color 0.4s ease;
            padding: 2rem 1rem;
        }

        /* Переключатель темы */
        .theme-toggle {
            position: absolute; top: 1.5rem; right: 1.5rem;
            background: transparent; border: 1px solid var(--card-border);
            color: var(--fg); border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.2rem; transition: all 0.2s ease;
            z-index: 100; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .theme-toggle:hover { background: var(--card-bg); border-color: var(--fg); }

        /* Логотип и заголовок */
        .header {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 3rem; text-align: center;
            animation: fadeInDown 1s ease-out both;
        }
        .logo {
            font-family: "Segoe UI Symbol", "Apple Color Emoji", "Noto Sans Symbols 2", sans-serif;
            font-size: 4rem; line-height: 1; color: var(--accent);
            margin-bottom: 1rem;
            animation: pulse 4s infinite ease-in-out;
        }
        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; letter-spacing: .3em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.85rem; letter-spacing: 0.1em; color: var(--mute);
            text-transform: uppercase; font-weight: 500;
        }

        /* Сетка карточек */
        .grid {
            display: grid; grid-template-columns: 1fr; gap: 1.5rem;
            width: 100%; max-width: 600px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 2rem; text-decoration: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            position: relative; overflow: hidden;
        }
        
        /* Блик при наведении */
        .card::before {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%); transition: transform 0.6s ease;
            pointer-events: none;
        }
        [data-theme="dark"] .card::before {
             background: linear-gradient(120deg, transparent, rgba(255,255,255,0.03), transparent);
        }
        .card:hover { 
            border-color: var(--card-hover-border);
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-4px);
        }
        .card:hover::before { transform: translateX(100%); }

        .card-icon {
            font-size: 1.8rem; margin-bottom: 1.5rem;
            color: var(--accent); opacity: 0.8;
        }
        .card-title {
            font-size: 1.1rem; font-weight: 700; color: var(--fg);
            margin-bottom: 0.5rem; letter-spacing: 0.02em;
        }
        .card-desc {
            font-size: 0.85rem; color: var(--mute); line-height: 1.5;
        }

        /* Футер */
        .footer {
            margin-top: 4rem; font-size: 0.75rem; color: var(--mute);
            letter-spacing: 0.05em; text-align: center;
            animation: fadeInUp 1s ease-out 0.4s both;
        }
        .footer a {
            color: inherit; text-decoration: none; border-bottom: 1px solid var(--divider);
            transition: border-color 0.2s;
        }
        .footer a:hover { border-color: var(--mute); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.05); opacity: 1; } }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>

    <header class="header">
        <div class="logo">☉</div>
        <h1>Hello Friend</h1>
        <div class="subtitle">no names · only traces</div>
    </header>

    <main class="grid">
        <a href="/portal/" class="card">
            <div>
                <div class="card-icon">🌀</div>
                <div class="card-title">Портал</div>
                <div class="card-desc">Случайные находки, скрытые ссылки и места, о которых не пишут в поисковиках.</div>
            </div>
        </a>

        <a href="/console/" class="card">
            <div>
                <div class="card-icon">💻</div>
                <div class="card-title">Консоль</div>
                <div class="card-desc">Виртуальная система. Изучай файлы, ищи следы, подбирай пароли и стань root.</div>
            </div>
        </a>
    </main>

    <footer class="footer">
        <p>© 2026 · <a href="https://github.com/hllfrnd" target="_blank" rel="noopener">hllfrnd</a></p>
    </footer>

    <script>
        // Логика переключения темы
        const themeToggle = document.getElementById('themeToggle');
        
        // Устанавливаем иконку при загрузке
        const currentTheme = document.documentElement.getAttribute('data-theme');
        themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
