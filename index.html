<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Friend</title>
    <style>
        /* Сброс отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Белый фон, выравнивание по центру экрана */
        body {
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #000000;
        }

        /* Символ ☉ */
        .symbol {
            font-size: 140px;      /* Размер символа */
            line-height: 1;
            margin-bottom: 20px;   /* Отступ до надписи */
        }

        /* Надпись Hello Friend */
        h1 {
            font-size: 3rem;       /* Размер шрифта */
            font-weight: 900;      /* Максимальная жирность */
            letter-spacing: 2px;   /* Расстояние между буквами */
        }
    </style>
</head>
<body>

    <!-- Символ -->
    <div class="symbol">☉</div>

    <!-- Название -->
    <h1>Hello Friend</h1>

</body>
</html>
