<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Hello Friend — цифровой архив странностей и следов.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#030303">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>☉ Hello Friend</title>

    <style>
        :root {
            --bg: #030303;
            --fg: #ededed;
            --dim: #71717a;
            --mute: #27272a;
            --accent: #ffffff;
            --card-bg: rgba(15, 15, 17, 0.45);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-border: rgba(255, 255, 255, 0.22);
            --card-hover-bg: rgba(25, 25, 30, 0.65);
            --watch-border: rgba(255, 255, 255, 0.28);
            --watch-glow: rgba(255, 255, 255, 0.14);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        /* Фоновые слои */
        .noise {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .vignette {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(0,0,0,0.9) 100%);
        }

        .container {
            position: relative; z-index: 10;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 2.5rem 1.5rem;
        }

        /* Шапка */
        .header {
            display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
            margin-bottom: 3.5rem;
            animation: fadeInDown 1.2s ease-out both;
        }
        .logo {
            font-size: clamp(3rem, 10vw, 5rem);
            line-height: 1;
            color: var(--accent);
            text-shadow: 0 0 40px rgba(255,255,255,0.22);
            animation: breathe 6s ease-in-out infinite;
        }
        .title {
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 800;
            letter-spacing: 0.5em;
            text-indent: 0.5em; /* компенсируем letter-spacing справа */
            text-transform: uppercase;
            color: var(--fg);
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .subtitle {
            font-size: 0.7rem; letter-spacing: 0.3em; color: var(--dim);
            text-transform: uppercase; margin-top: 0.4rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* Навигация */
        .nav {
            display: flex; flex-direction: column; gap: 1rem;
            width: 100%; max-width: 460px;
            animation: fadeInUp 1.2s ease-out 0.25s both;
        }

        .card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.5rem 1.8rem; text-decoration: none; color: inherit;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            transition: transform .35s cubic-bezier(.25,1,.5,1),
                        background-color .35s ease,
                        border-color .35s ease,
                        box-shadow .35s ease;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            position: relative; overflow: hidden;
            outline: none;
        }
        .card::before {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%); transition: transform .7s ease;
            pointer-events: none;
        }
        .card:hover {
            border-color: var(--card-hover-border);
            background: var(--card-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 12px 34px rgba(0,0,0,0.55);
        }
        .card:hover::before { transform: translateX(100%); }
        .card:focus-visible {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.18);
        }

        .card-content { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
        .card-title {
            font-size: 1rem; font-weight: 700; color: var(--fg);
            letter-spacing: 0.05em;
        }
        .card-desc {
            font-size: 0.75rem; color: var(--dim);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .card-icon {
            font-size: 1.2rem; color: var(--dim); flex-shrink: 0; margin-left: 1rem;
            transition: color .3s ease, transform .3s ease;
        }
        .card:hover .card-icon,
        .card:focus-visible .card-icon { color: var(--fg); transform: translateX(5px); }

        /* ★ Выделенная карточка Watcher */
        .card--featured {
            background: linear-gradient(135deg, rgba(30,30,36,0.75), rgba(12,12,14,0.55));
            border-color: var(--watch-border);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04),
                        0 0 40px var(--watch-glow),
                        inset 0 1px 0 rgba(255,255,255,0.06);
            padding: 1.75rem 1.9rem;
        }
        .card--featured::after {
            /* мягкая пульсация свечения */
            content: ""; position: absolute; inset: -1px; border-radius: inherit;
            box-shadow: 0 0 30px var(--watch-glow);
            opacity: 0; animation: pulseGlow 4s ease-in-out infinite;
            pointer-events: none;
        }
        .card--featured:hover {
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08),
                        0 0 60px rgba(255,255,255,0.22),
                        0 12px 34px rgba(0,0,0,0.55);
        }
        .card--featured .card-title {
            font-size: 1.15rem; letter-spacing: 0.08em;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .card--featured .card-desc { color: #a1a1aa; }

        .badge {
            font-size: 0.55rem; font-weight: 800; letter-spacing: 0.15em;
            text-transform: uppercase; color: #030303;
            background: var(--accent); border-radius: 999px;
            padding: 0.2rem 0.55rem; line-height: 1.4;
            box-shadow: 0 0 12px rgba(255,255,255,0.35);
        }

        /* Футер */
        .footer {
            margin-top: 4.5rem; font-size: 0.7rem; color: var(--mute);
            letter-spacing: 0.12em; text-align: center;
            animation: fadeInUp 1.2s ease-out 0.45s both;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* Анимации */
        @keyframes breathe {
            0%, 100% { opacity: .8; transform: scale(1); }
            50%      { opacity: 1;  transform: scale(1.03); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0; }
            50%      { opacity: 0.6; }
        }

        /* Доступность: уважаем предпочтения */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* Мобильные */
        @media (max-width: 600px) {
            .header { margin-bottom: 2.75rem; }
            .title { letter-spacing: 0.3em; text-indent: 0.3em; }
            .card { padding: 1.2rem 1.35rem; }
            .card--featured { padding: 1.4rem 1.45rem; }
        }
    </style>
</head>
<body>

    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main class="container">
        <header class="header">
            <div class="logo" aria-hidden="true">☉</div>
            <h1 class="title">Hello Friend</h1>
            <p class="subtitle">no names · only traces</p>
        </header>

        <nav class="nav" aria-label="Основная навигация">
            <!-- ★ Watcher — выделен и стоит первым -->
            <a href="https://hllfrnd.github.io/watcher/"
               class="card card--featured"
               rel="noopener"
               aria-label="Watcher — наблюдение и следы (новая страница)">
                <div class="card-content">
                    <div class="card-title">
                        Watcher
                        <span class="badge" aria-hidden="true">new</span>
                    </div>
                    <div class="card-desc">Наблюдение · сигналы · следы</div>
                </div>
                <div class="card-icon" aria-hidden="true">→</div>
            </a>

            <!-- Портал -->
            <a href="/portal/" class="card" aria-label="Портал — случайные находки и скрытые места">
                <div class="card-content">
                    <div class="card-title">Портал</div>
                    <div class="card-desc">Случайные находки и скрытые места</div>
                </div>
                <div class="card-icon" aria-hidden="true">→</div>
            </a>

            <!-- Консоль -->
            <a href="/console/" class="card" aria-label="Консоль — виртуальная система и следы">
                <div class="card-content">
                    <div class="card-title">Консоль</div>
                    <div class="card-desc">Виртуальная система и следы</div>
                </div>
                <div class="card-icon" aria-hidden="true">→</div>
            </a>
        </nav>

        <footer class="footer">
            archive // protocol 2026
        </footer>
    </main>

</body>
</html>
